blueprint:
  name: eVisitor – check out
  description: >-
    Check the mapped HA persons out of eVisitor based on presence. Two
    triggers feed the same per-person flow:

    * **Daily sweep** at a configurable time of day. Every configured
      person who is currently away (state not `home`, `unknown`, or
      `unavailable`) AND has been away for at least the grace period is
      considered for check-out.

    * **Long absence** anytime: as soon as a person has been away
      continuously for the long-absence threshold, they are considered
      for check-out immediately. Acts as a safety net for guests who
      leave permanently mid-day.

    Three modes select how much user interaction the check-out needs:

    * **silent** — register the check-out immediately, no notification.
    * **notify** — register the check-out immediately AND send a
      passive notification telling you it happened.
    * **confirm** — send an actionable notification first; register
      only if the user taps "Check out" (rather than "Keep checked
      in"). On timeout the check-out is skipped for that person.

    For `notify` and `confirm`, pick the notification platform via the
    `platform` input:

    * HA Companion app — push notification via a `notify.mobile_app_*`
      service; buttons render natively on the lockscreen.
    * Telegram — message via `telegram_bot.send_message` with an
      inline keyboard; buttons render inside the Telegram chat.

    Caveats:

    * The long-absence trigger uses HA's `state` trigger with a `for:`
      duration; if a person hops between named zones (e.g. `home` →
      `work` → `airport`) the duration timer resets at each zone
      change. The daily sweep is the correctness net — it walks
      everyone unconditionally.

    * In `confirm` mode the sweep prompts each person sequentially, so
      a long `notification_timeout_minutes` will delay subsequent
      persons by that amount. Keep the timeout short (≤ 30 min is a
      good default) and rely on the long-absence trigger to retry.
  domain: automation
  source_url: https://raw.githubusercontent.com/skateman/ha-evisitor/main/custom_components/evisitor/blueprints/automation/evisitor/auto_check_out.yaml
  input:
    person:
      name: Person(s)
      description: >-
        One or more HA person entities. Each is processed independently
        on both the daily sweep and the long-absence trigger.
      selector:
        entity:
          domain: person
          multiple: true

    mode:
      name: Action mode
      description: >-
        How to handle the check-out. "silent" requires no user action;
        "notify" sends a passive informational notification after
        checking out; "confirm" requires the user to tap a button
        before the check-out is registered.
      default: confirm
      selector:
        select:
          options:
            - label: Silent — register immediately, no notification
              value: silent
            - label: Notify — register + send a passive notification
              value: notify
            - label: Confirm — actionable notification, register on tap
              value: confirm

    grace_minutes:
      name: Sweep grace period (minutes)
      description: >-
        At the daily sweep, only persons who have been away for at
        least this long are considered for check-out. Also used to
        gate the long-absence trigger when its threshold happens to
        be set lower than this value.
      default: 120
      selector:
        number:
          min: 5
          max: 1440
          step: 1
          unit_of_measurement: min
          mode: box

    sweep_time:
      name: Daily sweep time
      description: >-
        Time of day the sweep runs. Fires exactly once per day at this
        local wall-clock time.
      default: "20:00:00"
      selector:
        time:

    long_absence_hours:
      name: Long-absence threshold (hours)
      description: >-
        Outside the daily sweep, a person who has been continuously
        away for at least this many hours is considered for check-out
        immediately. Note: state changes between named zones reset
        this timer; the daily sweep is the correctness net.
      default: 6
      selector:
        number:
          min: 1
          max: 24
          step: 1
          unit_of_measurement: h
          mode: box

    platform:
      name: Notification platform
      description: >-
        Used for `notify` and `confirm` modes. Ignored for `silent`.
      default: companion
      selector:
        select:
          options:
            - label: HA Companion app
              value: companion
            - label: Telegram bot
              value: telegram

    notify_service:
      name: Companion notify service
      description: >-
        Used when platform = "companion". Example:
        `notify.mobile_app_my_phone`. Ignored for Telegram or silent.
      default: ""
      selector:
        text:

    telegram_chat_id:
      name: Telegram chat ID
      description: >-
        Used when platform = "telegram". Numeric chat ID (positive
        for private chats, negative for group chats). Ask @userinfobot
        on Telegram for your own ID. Ignored for Companion or silent.
      default: ""
      selector:
        text:

    notification_title:
      name: Notification title
      description: >-
        Title shown above the message. On Companion this is the
        notification title; on Telegram it is rendered as bold text
        at the top of the message (markdown).
      default: "eVisitor"
      selector:
        text:

    notification_message:
      name: Notification message
      description: >-
        Text shown in the notification. The placeholder ``{name}`` is
        replaced with the person's friendly name. Default phrasing
        works for both `notify` and `confirm`; override if you want
        e.g. past-tense text for `notify`-mode (like
        "{name} left; checked out of eVisitor.").
      default: "Check {name} out of eVisitor?"
      selector:
        text:

    check_out_action_label:
      name: 'Button label: Check out (confirm mode)'
      default: "Check out"
      selector:
        text:

    keep_in_action_label:
      name: 'Button label: Keep checked in (confirm mode)'
      default: "Keep them"
      selector:
        text:

    check_out_done_message:
      name: 'Telegram edit text: after check out'
      description: >-
        Telegram only, confirm mode. After the user taps the
        check-out button, the original prompt message is edited
        in-place to this text (with inline buttons removed). The
        placeholder ``{name}`` is replaced with the person's
        friendly name. Has no effect on Companion notifications
        (which cannot be edited in place).
      default: "{name} checked out ✓"
      selector:
        text:

    keep_in_done_message:
      name: 'Telegram edit text: after keep checked in'
      description: >-
        Telegram only, confirm mode. After the user taps the keep
        checked-in button, the original prompt message is edited
        in-place to this text (with inline buttons removed). The
        placeholder ``{name}`` is replaced with the person's
        friendly name. Has no effect on Companion notifications.
      default: "{name} not checked out"
      selector:
        text:

    notification_timeout_minutes:
      name: Confirm timeout (minutes)
      description: >-
        How long to wait for the user's tap before skipping the
        check-out for that person. Only used in `confirm` mode. Keep
        short (≤ 30 min) so the sweep does not stall on later persons.
      default: 30
      selector:
        number:
          min: 1
          max: 1440
          step: 1
          unit_of_measurement: min
          mode: box

variables:
  mode: !input mode
  platform: !input platform
  telegram_chat_id: !input telegram_chat_id
  grace_minutes: !input grace_minutes
  notification_title: !input notification_title
  notification_message: !input notification_message
  check_out_action_label: !input check_out_action_label
  keep_in_action_label: !input keep_in_action_label
  check_out_done_message: !input check_out_done_message
  keep_in_done_message: !input keep_in_done_message
  notification_timeout_minutes: !input notification_timeout_minutes
  # Resolved here so the companion-only `service:` field below renders
  # via a template (runtime) instead of being substituted literally at
  # blueprint-instantiate time. An empty default for telegram users
  # would otherwise trip Home Assistant's static service-name
  # validator before the dead companion branch is ever reached.
  notify_service_name: !input notify_service
  # Persons configured on the blueprint, materialised once so the
  # sweep-path template can iterate without re-reading the input.
  configured_persons: !input person

trigger:
  - platform: time
    id: sweep
    at: !input sweep_time
  - platform: state
    id: long_absence
    entity_id: !input person
    from: "home"
    for:
      hours: !input long_absence_hours

action:
  # ============================================================
  # 0. Build per-run scratch variables.
  # ============================================================
  #
  # - `run_id` makes per-iteration notification action IDs unique to
  #   this run, so a parallel run (e.g. sweep and long_absence
  #   overlapping for the same person) cannot share button IDs and
  #   double-fire the check-out service.
  # - `grace_seconds` is the unified away-duration filter applied
  #   inside the per-person loop, so the long-absence path also
  #   respects `grace_minutes` if the user happens to configure
  #   `long_absence_hours` lower than `grace_minutes / 60`.
  # - `targets` is the list of persons this run should consider.
  #   Sweep: every configured person (filter applied per iteration).
  #   Long absence: just the entity that fired the state trigger.
  - variables:
      run_id: "{{ context.id[-8:] }}"
      grace_seconds: "{{ (grace_minutes | int) * 60 }}"
      targets: >-
        {%- if trigger.id == 'long_absence' -%}
        {{ [trigger.entity_id] }}
        {%- else -%}
        {{ configured_persons }}
        {%- endif -%}

  # ============================================================
  # 1. Walk the targets serially.
  # ============================================================
  - repeat:
      for_each: "{{ targets }}"
      sequence:
        # 1a. Iteration-local vars derived from `repeat.item` (NOT
        # `trigger.entity_id` — that is undefined on the sweep path).
        - variables:
            target_person: "{{ repeat.item }}"
            target_state: "{{ states(target_person) }}"
            target_last_changed: "{{ states[target_person].last_changed }}"
            target_away_seconds: "{{ (now() - target_last_changed).total_seconds() | int }}"
            # Per-person binary_sensor the integration creates; used by
            # the eligibility gate below to skip persons who are already
            # not checked in. Other states (off, unknown, unavailable,
            # missing) treat as "not checked in" -- the gate falls
            # through and the iteration is skipped silently.
            checked_in_entity: "binary_sensor.{{ target_person.split('.')[-1] }}_checked_in"
            # Slash-prefixed so the same string works as a Telegram
            # callback_data (which conventionally looks like a
            # /command) and as a Companion action ID. `run_id` +
            # `repeat.index` keep IDs unique across parallel runs.
            action_check_out: "/evisitor_check_out_{{ run_id }}_{{ repeat.index }}"
            action_keep_in: "/evisitor_keep_in_{{ run_id }}_{{ repeat.index }}"
            person_name: "{{ state_attr(target_person, 'friendly_name') or target_person }}"
            rendered_message: "{{ notification_message.replace('{name}', person_name) }}"

        # 1b. Per-person eligibility gate. `choose:` without a `default`
        # skips the iteration silently when the person is home / has
        # not been away long enough / is not currently checked in --
        # crucial that we do NOT use `stop:` or a bare `condition:`
        # here, both of which would abort the whole repeat run and
        # skip later persons.
        - choose:
            - conditions:
                - condition: template
                  value_template: >-
                    {{ target_state not in ['home', 'unknown', 'unavailable']
                       and target_away_seconds >= (grace_seconds | int)
                       and states(checked_in_entity) == 'on' }}
              sequence:
                # 1c. Confirm mode: send actionable, wait, branch.
                - choose:
                    - conditions:
                        - "{{ mode == 'confirm' }}"
                      sequence:
                        - choose:
                            - conditions:
                                - "{{ platform == 'companion' }}"
                              sequence:
                                - service: "{{ notify_service_name }}"
                                  data:
                                    title: "{{ notification_title }}"
                                    message: "{{ rendered_message }}"
                                    data:
                                      actions:
                                        - action: "{{ action_check_out }}"
                                          title: "{{ check_out_action_label }}"
                                        - action: "{{ action_keep_in }}"
                                          title: "{{ keep_in_action_label }}"

                            - conditions:
                                - "{{ platform == 'telegram' }}"
                              sequence:
                                - service: telegram_bot.send_message
                                  data:
                                    # `chat_id` replaces the deprecated
                                    # `target` parameter (HA removed
                                    # `target` in 2026.9.0).
                                    chat_id: "{{ telegram_chat_id | int(0) }}"
                                    # Telegram has no separate title field;
                                    # render the title as bold markdown.
                                    message: "*{{ notification_title }}*\n{{ rendered_message }}"
                                    parse_mode: markdown
                                    inline_keyboard:
                                      - "{{ check_out_action_label }}:{{ action_check_out }}, {{ keep_in_action_label }}:{{ action_keep_in }}"

                        # 1d. Wait for the user's response. Listens for
                        # both Companion and Telegram event shapes; only
                        # the one matching the chosen platform fires.
                        - wait_for_trigger:
                            - platform: event
                              event_type: mobile_app_notification_action
                              event_data:
                                action: "{{ action_check_out }}"
                            - platform: event
                              event_type: mobile_app_notification_action
                              event_data:
                                action: "{{ action_keep_in }}"
                            - platform: event
                              event_type: telegram_callback
                              event_data:
                                data: "{{ action_check_out }}"
                            - platform: event
                              event_type: telegram_callback
                              event_data:
                                data: "{{ action_keep_in }}"
                          timeout:
                            minutes: "{{ notification_timeout_minutes | int }}"
                          # Must be true: false would abort the whole
                          # repeat run on the first timed-out prompt
                          # and skip later persons.
                          continue_on_timeout: true

                        # 1e. Telegram only: ack the callback (small
                        # toast popup) AND edit the original prompt
                        # message in place to reflect the outcome,
                        # removing the inline keyboard so the buttons
                        # cannot be tapped again. Companion
                        # notifications cannot be edited in place, so
                        # this branch is skipped for them; the
                        # original notification simply ages out.
                        - choose:
                            - conditions:
                                - "{{ wait.trigger is not none }}"
                                - "{{ wait.trigger.event.event_type == 'telegram_callback' }}"
                              sequence:
                                - service: telegram_bot.answer_callback_query
                                  data:
                                    callback_query_id: "{{ wait.trigger.event.data.id }}"
                                    message: >-
                                      {%- if wait.trigger.event.data.data == action_check_out -%}
                                      {{ check_out_action_label }} ✓
                                      {%- else -%}
                                      {{ keep_in_action_label }} ✓
                                      {%- endif -%}
                                - service: telegram_bot.edit_message
                                  data:
                                    # `message_id` + `chat_id` identify
                                    # the original prompt; both are
                                    # carried by the callback event.
                                    message_id: "{{ wait.trigger.event.data.message.message_id }}"
                                    chat_id: "{{ wait.trigger.event.data.chat_id }}"
                                    parse_mode: markdown
                                    # Empty list strips the original
                                    # inline keyboard so the buttons
                                    # disappear after the tap.
                                    inline_keyboard: []
                                    message: >-
                                      *{{ notification_title }}*

                                      {% if wait.trigger.event.data.data == action_check_out -%}
                                      {{ check_out_done_message.replace('{name}', person_name) }}
                                      {%- else -%}
                                      {{ keep_in_done_message.replace('{name}', person_name) }}
                                      {%- endif %}

                # 1f. Decide whether to actually check this person out.
                # In confirm mode: only if the user tapped Check out
                # (not Keep them, not timeout). In silent / notify
                # modes: always.
                - choose:
                    - conditions:
                        - >-
                          {{ mode != 'confirm'
                             or (wait.trigger is not none
                                 and ((wait.trigger.event.data.action | default('')) == action_check_out
                                      or (wait.trigger.event.data.data | default('')) == action_check_out)) }}
                      sequence:
                        - service: evisitor.check_out_person
                          data:
                            person: "{{ target_person }}"
                            # Moment the person last transitioned into
                            # their current state. For a person who
                            # left home and stayed in one zone, this
                            # is when they left home. For zone-hoppers
                            # it is the latest zone-arrival timestamp.
                            check_out_at: "{{ target_last_changed.isoformat() }}"

                        # 1g. Notify mode: passive informational
                        # notification after the check-out.
                        - choose:
                            - conditions:
                                - "{{ mode == 'notify' }}"
                              sequence:
                                - choose:
                                    - conditions:
                                        - "{{ platform == 'companion' }}"
                                      sequence:
                                        - service: "{{ notify_service_name }}"
                                          data:
                                            title: "{{ notification_title }}"
                                            message: "{{ rendered_message }}"
                                            # No `data.actions` -- passive only.

                                    - conditions:
                                        - "{{ platform == 'telegram' }}"
                                      sequence:
                                        - service: telegram_bot.send_message
                                          data:
                                            chat_id: "{{ telegram_chat_id | int(0) }}"
                                            message: "*{{ notification_title }}*\n{{ rendered_message }}"
                                            parse_mode: markdown
                                            # No `inline_keyboard` -- passive only.

mode: parallel
max: 10
